<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" font-family="IPAGothic, Noto Sans JP, Hiragino Sans, sans-serif" role="img" aria-label="ラインは 8 工程が双腕、検査 2 工程が単腕、3 本以上は無い。同時に確定させる点の数が腕数を決める。">
<rect width="1120" height="660" fill="#ffffff"/>
<text x="30" y="36" font-size="18" font-weight="700" fill="#16181d">腕数と工程 — 人手に代わる、という前提で</text>
<text x="30" y="58" font-size="12.5" fill="#7a7f87">決めているのは「その工程で同時に確定させないといけない点の数」。人は 2 本しか持たない</text>
<text x="30" y="96" font-size="14" font-weight="700" fill="#16181d">ラインの実装（既に答えが出ている）</text>
<rect x="30" y="102" width="88" height="72" rx="6" fill="none" stroke="#1f6f8b" stroke-width="1" opacity="0.75"/>
<text x="74" y="120" font-size="12" text-anchor="middle" font-weight="400" fill="#1f6f8b">OP010</text>
<circle cx="67.5" cy="140" r="5" fill="none" stroke="#1f6f8b" stroke-width="2"/>
<circle cx="80.5" cy="140" r="5" fill="none" stroke="#1f6f8b" stroke-width="2"/>
<text x="74" y="166" font-size="10.5" text-anchor="middle" fill="#7a7f87">部品を取る</text>
<rect x="134" y="102" width="88" height="72" rx="6" fill="none" stroke="#1f6f8b" stroke-width="1" opacity="0.75"/>
<text x="178" y="120" font-size="12" text-anchor="middle" font-weight="400" fill="#1f6f8b">OP020</text>
<circle cx="171.5" cy="140" r="5" fill="none" stroke="#1f6f8b" stroke-width="2"/>
<circle cx="184.5" cy="140" r="5" fill="none" stroke="#1f6f8b" stroke-width="2"/>
<text x="178" y="166" font-size="10.5" text-anchor="middle" fill="#7a7f87">取らない</text>
<rect x="238" y="102" width="88" height="72" rx="6" fill="none" stroke="#c0392b" stroke-width="2" opacity="0.75"/>
