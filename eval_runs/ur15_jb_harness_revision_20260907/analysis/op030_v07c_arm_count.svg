<line x1="354.5" y1="498" x2="354.5" y2="544" stroke="#1f6f8b" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.8"/>
<text x="36" y="636" font-size="11.5" fill="#7a7f87">締結 2 本が同じ支持部の 68 mm に寄る。自己干渉は未計測</text>
<rect x="480" y="370" width="440" height="280" fill="none" stroke="#7a7f87" stroke-width="1" rx="6" opacity="0.5"/>
<text x="496" y="398" font-size="15" font-weight="700" fill="#16181d">④ 4 腕</text>
