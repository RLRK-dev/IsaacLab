<text x="496" y="437" font-size="12" fill="#16181d">B：2 本使用、2 本は待機</text>
<text x="496" y="454" font-size="12" fill="#16181d">C：M6/M14 × 2 端子を同時</text>
<rect x="589.0" y="547" width="52" height="26" rx="3" fill="none" stroke="#16181d" stroke-width="1.2"/>
<text x="615.0" y="590" font-size="11" text-anchor="middle" fill="#7a7f87">T02</text>
