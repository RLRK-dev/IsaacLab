<line x1="230.0" y1="198" x2="230.0" y2="244" stroke="#16181d" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.8"/>
<text x="36" y="336" font-size="11.5" fill="#7a7f87">A・B は治具か機構の追加が要る（制約 2 に抵触）。C のみ成立</text>
<rect x="480" y="70" width="440" height="280" fill="none" stroke="#7a7f87" stroke-width="1" rx="6" opacity="0.5"/>
