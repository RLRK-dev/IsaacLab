<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" width="960" height="670" font-family="IPAGothic, Noto Sans JP, Hiragino Sans, sans-serif" role="img" aria-label="腕数 1・2・3・4 の比較。作業点は支持部 2 個が 320 mm、1 個あたりボルト 2 本が 68 mm。">
<rect width="960" height="670" fill="#ffffff"/>
<text x="24" y="30" font-size="17" font-weight="700" fill="#16181d">腕数の比較 — 作業点は固定：支持部 2 個 320 mm、1 個あたりボルト 2 本 68 mm</text>
<text x="24" y="52" font-size="12" fill="#7a7f87">同時に要る腕：A 2・B 2・C 1（各工程のシーケンスから）／現行の肩ピッチ 465 mm</text>
