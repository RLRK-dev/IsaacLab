<text x="496" y="120" font-size="12" fill="#16181d">A：押さえ 1・締結 1</text>
<text x="496" y="137" font-size="12" fill="#16181d">B：両端を 1 本ずつ</text>
<text x="496" y="154" font-size="12" fill="#16181d">C：M6 と M14、直列</text>
