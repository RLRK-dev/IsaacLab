<div id="hvjb-ses2001-comparison-v01">
  <h3>締付工具の先端と取付位置</h3>
  <div class="viz-controls">
    <label class="form-label">同じ縮尺で比較
      <select class="form-select" data-field="view">
        <option value="front">先端側（後部は画面外）</option>
        <option value="whole">全体</option>
      </select>
    </label>
  </div>
  <div class="viz-row tool-legend" data-layout>
    <span><span class="axis-key" aria-hidden="true"></span>点線：締付軸</span>
    <span><span class="mount-key" aria-hidden="true"></span>実線：取付面の位置</span>
  </div>
  <section data-tool="SES2001">
    <div class="tabular-nums" data-detail></div>
    <div class="tool-picture"><img alt="" data-image><svg data-overlay aria-hidden="true"></svg></div>
  </section>
  <section data-tool="SEV2001">
    <div class="tabular-nums" data-detail></div>
    <div class="tool-picture"><img alt="" data-image><svg data-overlay aria-hidden="true"></svg></div>
  </section>
  <div class="text-small text-muted" aria-live="polite" data-caption>メーカー例示CAD／保存姿勢／締結時の先端位置は未確定</div>
  <script type="application/json" data-model>__MODEL_DATA__</script>
</div>
<style>
  #hvjb-ses2001-comparison-v01 .tool-legend {margin-block:8px 16px;}
  #hvjb-ses2001-comparison-v01 .axis-key,
  #hvjb-ses2001-comparison-v01 .mount-key {display:inline-block; width:22px; vertical-align:middle; margin-inline-end:6px;}
  #hvjb-ses2001-comparison-v01 .axis-key {border-top:2px dashed var(--viz-series-1);}
  #hvjb-ses2001-comparison-v01 .mount-key {border-top:2px solid var(--viz-series-2);}
  #hvjb-ses2001-comparison-v01 section {margin-block:12px;}
  #hvjb-ses2001-comparison-v01 .tool-picture {position:relative; margin-block:4px;}
  #hvjb-ses2001-comparison-v01 [data-image] {display:block; width:100%; height:auto;}
  #hvjb-ses2001-comparison-v01 [data-overlay] {position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
</style>
<script>
(() => {
  "use strict";
  const root = document.getElementById("hvjb-ses2001-comparison-v01");
  const data = JSON.parse(root.querySelector("[data-model]").textContent);
  const ns = "http://www.w3.org/2000/svg";
  let view;
  function draw() {
    if (!view) return;
    for (const section of root.querySelectorAll("[data-tool]")) {
      const model = data.models[section.dataset.tool], frame = model.frames[view];
      const svg = section.querySelector("svg"), image = section.querySelector("img");
      const width = image.clientWidth, height = width * frame.pixels[1] / frame.pixels[0];
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`); svg.replaceChildren();
      const project = ([x,z]) => [(x-frame.x_m[0])/(frame.x_m[1]-frame.x_m[0])*width,
        (frame.z_m[1]-z)/(frame.z_m[1]-frame.z_m[0])*height];
      function line(points, color, dash = "") {
        const [[x1,y1],[x2,y2]] = points.map(project), node = document.createElementNS(ns, "line");
        for (const [key,value] of Object.entries({x1,y1,x2,y2,stroke:color,"stroke-width":1.8,"stroke-dasharray":dash})) node.setAttribute(key,value);
        svg.append(node);
      }
      line(model.annotations.axis_line_xz_m, "var(--viz-series-1)", "7 5");
      line(model.annotations.plane_line_xz_m, "var(--viz-series-2)");
      line(model.annotations.dimension_line_xz_m, "var(--foreground)");
      const start = [frame.x_m[0]+0.015,frame.z_m[0]+0.015];
      line([start,[start[0]+0.1,start[1]]], "var(--foreground)");
      const [x,y] = project(start), label = document.createElementNS(ns, "text");
      label.setAttribute("x",x); label.setAttribute("y",y-7); label.setAttribute("fill","var(--foreground)");
      label.setAttribute("class","text-small"); label.textContent="100 mm"; svg.append(label);
    }
  }
  function update() {
    view = root.querySelector("select").value;
    const observation = {};
    for (const section of root.querySelectorAll("[data-tool]")) {
      const name = section.dataset.tool, model = data.models[name], frame = model.frames[view];
      const image = section.querySelector("img");
      image.width = frame.pixels[0]; image.height = frame.pixels[1]; image.src = frame.data_url;
      image.alt = `${name}の保存CAD。締付軸から取付面まで${model.distance_mm.toFixed(1)} mm。${view==="front"?"先端側の拡大図。":"全体図。"}`;
      section.querySelector("[data-detail]").textContent = `${name} · 締付軸から取付面まで ${model.distance_mm.toFixed(1)} mm`;
      observation[name] = {view,pixels:frame.pixels,png_sha256:frame.png_sha256,webp_sha256:frame.webp_sha256,
        distance_mm:model.distance_mm,annotations:model.annotations};
    }
    root.dataset.observation=JSON.stringify(observation); draw(); root.dataset.ready="true";
  }
  root.querySelector("select").addEventListener("change",update);
  new ResizeObserver(draw).observe(root);
  update();
})();
</script>
