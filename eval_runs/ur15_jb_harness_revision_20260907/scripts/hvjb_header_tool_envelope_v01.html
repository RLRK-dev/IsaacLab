<div id="hvjb-header-tool-envelope-v01">
  <style>
    #hvjb-header-tool-envelope-v01 { position:relative; }
    #hvjb-header-tool-envelope-v01 .drawing { display:block; width:100%; }
    #hvjb-header-tool-envelope-v01 .drawing text { fill:var(--foreground); font-size:12px; }
    #hvjb-header-tool-envelope-v01 .frame { fill:none; stroke:var(--border); }
    #hvjb-header-tool-envelope-v01 .aperture { fill:var(--muted); fill-opacity:.3; stroke:var(--border); }
    #hvjb-header-tool-envelope-v01 .axis-mark { fill:none; stroke:var(--foreground); }
    #hvjb-header-tool-envelope-v01 .active-ring { fill:none; stroke:var(--viz-series-1); stroke-width:2; }
    #hvjb-header-tool-envelope-v01 .series-legend { display:flex; flex-wrap:wrap; gap:8px 18px; }
    #hvjb-header-tool-envelope-v01 .series-legend button { display:inline-flex; align-items:center; gap:6px; padding:0; background:none; border:0; color:var(--foreground); font:inherit; cursor:pointer; }
    #hvjb-header-tool-envelope-v01 .series-legend button[aria-pressed="false"] { opacity:.45; }
    #hvjb-header-tool-envelope-v01 .swatch { width:20px; height:2px; display:inline-block; }
    #hvjb-header-tool-envelope-v01 .tooltip { position:absolute; pointer-events:none; background:var(--popover); color:var(--popover-foreground); padding:8px; max-width:calc(100% - 16px); }
    @media (pointer:coarse) { #hvjb-header-tool-envelope-v01 .series-legend button { min-height:44px; } }
  </style>
  <h3>保持フィンガと工具の張り出し</h3>
  <div class="viz-controls">
    <label class="form-label">ねじ位置
      <select class="form-select" data-screw aria-label="ねじ位置"></select>
    </label>
    <label class="form-label" for="hvjb-envelope-position-v01">工具CAD前端の仮位置：<output class="tabular-nums" data-offset-label for="hvjb-envelope-position-v01">0 mm</output>
      <input class="form-range" id="hvjb-envelope-position-v01" type="range" min="0" max="100" step="2" value="0" data-offset aria-label="工具CAD全体の仮の軸方向位置、ミリメートル" />
    </label>
  </div>
  <div class="text-small">実際の締付位置・ビット突出量は未設定</div>
  <svg class="drawing" data-map role="img" aria-label="選択したヘッダーと公称ねじ位置"></svg>
  <div class="series-legend" aria-label="半径の系列"></div>
  <svg class="drawing" data-profile role="img" aria-label="同軸と仮定した保存工具の最大半径と保持フィンガの最小半径"></svg>
  <div class="text-small tabular-nums" data-detail aria-live="polite"></div>
  <div class="text-small">2 mm区間・全周の半径比較 ／ 3Dの隙間・接触は未判定</div>
  <div class="tooltip text-small tabular-nums" role="tooltip" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
  (() => {
    const root=document.getElementById('hvjb-header-tool-envelope-v01');
    const data=__ENVELOPE_DATA__, rows=data.headers.flatMap(h=>h.axes);
    const ns='http://www.w3.org/2000/svg', select=root.querySelector('select'), slider=root.querySelector('[data-offset]');
    const series=[['H05','H05：最も近い表面',1],['SES2001','SES2001：最大張出し',2],['SEV2001','SEV2001：最大張出し',3]];
    const visible=new Set(series.map(s=>s[0])), tooltip=root.querySelector('[role="tooltip"]');
    const lookup=Object.fromEntries(Object.entries(data.tools).map(([name,tool])=>[name,new Map(tool.profile.map(b=>[Math.round(b.depth_mm[0]/data.bin_mm),b]))]));
    const fmt=n=>Number(n.toFixed(3)).toString(), signed=n=>(n>0?'+':'')+fmt(n);
    let pinned=false;
    for(const row of rows) {
      const option=document.createElement('option'), x=row.axis_xz_mm[0], z=row.axis_xz_mm[1];
      option.value=row.id; option.textContent=`${row.header_label} · ${row.number}（${x<0?'左':x>0?'右':'中央'}${z>0?'上':'下'}）`;select.append(option);
    }
    select.value=rows[1].id;
    slider.min=data.offset_mm.minimum;slider.max=data.offset_mm.maximum;slider.step=data.offset_mm.step;slider.value=data.offset_mm.initial_display;
    const element=(svg,tag,attrs,text)=>{
      const node=document.createElementNS(ns,tag);
      for(const [key,value] of Object.entries(attrs))node.setAttribute(key,String(value));
      if(text!==undefined)node.textContent=text;
      svg.append(node);return node;
    };
    const label=(svg,x,y,text,anchor='start')=>element(svg,'text',{x,y,'text-anchor':anchor,'data-label':''},text);
    for(const [key,name,color] of series) {
      const button=document.createElement('button');button.type='button';button.setAttribute('aria-pressed','true');button.dataset.series=key;
      const swatch=document.createElement('span');swatch.className='swatch';swatch.style.background=`var(--viz-series-${color})`;
      button.append(swatch,document.createTextNode(name));
      button.addEventListener('click',()=>{visible.has(key)?visible.delete(key):visible.add(key);button.setAttribute('aria-pressed',String(visible.has(key)));draw();});
      root.querySelector('.series-legend').append(button);
    }
    function drawMap(header,selected) {
      const svg=root.querySelector('[data-map]'), width=svg.getBoundingClientRect().width;
      const xs=header.axes.map(a=>a.axis_xz_mm[0]), zs=header.axes.map(a=>a.axis_xz_mm[1]);
      const xBounds=[Math.min(...xs)-9,Math.max(...xs)+9],zBounds=[Math.min(...zs)-6,Math.max(...zs)+6];
      const left=64,right=26,top=34,scale=(width-left-right)/(xBounds[1]-xBounds[0]);
      const inside=(zBounds[1]-zBounds[0])*scale,height=top+inside+48;
      const x=v=>left+(v-xBounds[0])*scale,y=v=>top+(zBounds[1]-v)*scale;
      svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.style.height=`${height}px`;
      label(svg,0,18,`${header.label} · ${header.part_number}`);
      element(svg,'rect',{x:left,y:top,width:width-left-right,height:inside,class:'frame'});
      for(let i=0;i<header.bay_x_mm.length;i++) {
        const w=header.aperture_widths_mm[i];
        element(svg,'rect',{x:x(header.bay_x_mm[i]-w/2),y:y(data.aperture_height_mm/2),width:w*scale,
          height:data.aperture_height_mm*scale,rx:data.aperture_radius_mm*scale,class:'aperture'});
      }
      for(const value of [...new Set(xs)])label(svg,x(value),top+inside+19,fmt(value),'middle');
      for(const value of [...new Set(zs)])label(svg,left-8,y(value)+4,fmt(value),'end');
      label(svg,(left+width-right)/2,height-5,'X [mm]','middle');label(svg,1,top+inside/2,'Z [mm]');
      for(const row of header.axes) {
        const px=x(row.axis_xz_mm[0]),py=y(row.axis_xz_mm[1]);
        element(svg,'path',{d:`M${px-4} ${py}H${px+4}M${px} ${py-4}V${py+4}`,class:'axis-mark','data-id':row.id});
        label(svg,px+8,py+4,String(row.number));
        if(row.id===selected.id)element(svg,'circle',{cx:px,cy:py,r:9,class:'active-ring'});
      }
      svg.dataset.projection=JSON.stringify({width,height,left,top,scale,xBounds,zBounds,feature_id:header.feature_id});
    }
    function registered(selected,offset) {
      return selected.profile.map(band=>{
        const index=Math.round((band.depth_mm[0]-offset)/data.bin_mm);
        return {depth_mm:band.depth_mm,radius_mm:{H05:band.radius_mm,
          SES2001:lookup.SES2001.get(index)?.radius_mm??null,SEV2001:lookup.SEV2001.get(index)?.radius_mm??null}};
      });
    }
    function minimumDifferences(bands) {
      return Object.fromEntries(['SES2001','SEV2001'].map(name=>{
        const matches=bands.flatMap((band,index)=>band.radius_mm.H05!==null&&band.radius_mm[name]!==null?
          [{difference_mm:band.radius_mm.H05-band.radius_mm[name],hand_bin_index:index}]:[]);
        matches.sort((a,b)=>a.difference_mm-b.difference_mm||a.hand_bin_index-b.hand_bin_index);
        return [name,{compared_bins:matches.length,minimum:matches[0]??null}];
      }));
    }
    function drawProfile(bands,offset) {
      const svg=root.querySelector('[data-profile]'),width=svg.getBoundingClientRect().width,height=314;
      const left=64,right=20,top=24,bottom=56;
      const extentX=d3.extent(bands.flatMap(b=>b.depth_mm));
      const extentY=d3.extent([0,...bands.flatMap(b=>Object.values(b.radius_mm)).filter(v=>v!==null)]);
      const x=d3.scaleLinear().domain([extentX[0]-(extentX[1]-extentX[0])*.02,extentX[1]+(extentX[1]-extentX[0])*.02]).range([left+5,width-right-5]);
      const y=d3.scaleLinear().domain([0,extentY[1]*1.05]).range([height-bottom-5,top+5]);
      svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.style.height=`${height}px`;
      element(svg,'rect',{x:left,y:top,width:width-left-right,height:height-top-bottom,class:'frame','data-chart-frame':''});
      for(const value of x.ticks(width<400?3:6))label(svg,x(value),height-bottom+21,fmt(value),'middle');
      for(const value of y.ticks(5)) {
        element(svg,'line',{x1:left,y1:y(value),x2:width-right,y2:y(value),stroke:'var(--border)'});
        label(svg,left-8,y(value)+4,fmt(value),'end');
      }
      const xt=label(svg,(left+width-right)/2,height-9,'筐体基準から外側 d [mm]','middle');xt.classList.add('axis-title');xt.dataset.axis='x';
      const yt=label(svg,17,(top+height-bottom)/2,'軸からの半径 [mm]','middle');yt.classList.add('axis-title');yt.dataset.axis='y';
      yt.setAttribute('transform',`rotate(-90 17 ${(top+height-bottom)/2})`);
      const line=d3.line().defined(p=>p.r!==null).x(p=>x(p.d)).y(p=>y(p.r));
      for(const [key,,color] of series) {
        if(!visible.has(key))continue;
        const points=bands.flatMap(b=>[{d:b.depth_mm[0],r:b.radius_mm[key]},{d:b.depth_mm[1],r:b.radius_mm[key]}]);
        element(svg,'path',{d:line(points),fill:'none',stroke:`var(--viz-series-${color})`,'stroke-width':2,'data-series-path':key});
      }
      if(offset>=extentX[0]&&offset<=extentX[1])element(svg,'line',{x1:x(offset),x2:x(offset),y1:top,y2:height-bottom,
        stroke:'var(--foreground)','stroke-dasharray':'3 4','data-registration-guide':''});
      const guide=element(svg,'line',{y1:top,y2:height-bottom,stroke:'var(--foreground)','data-chart-hover-guide':'',visibility:'hidden'});
      const marks=element(svg,'g',{'data-markers':''});
      const overlay=element(svg,'rect',{x:left,y:top,width:width-left-right,height:height-top-bottom,fill:'transparent',
        'data-chart-hit':'','data-chart-hover-overlay':'cross-series'});
      const show=event=>{
        const box=svg.getBoundingClientRect(),px=Math.min(width-right,Math.max(left,(event.clientX-box.left)*width/box.width)),depth=x.invert(px);
        guide.setAttribute('x1',px);guide.setAttribute('x2',px);guide.setAttribute('visibility','visible');marks.replaceChildren();
        const band=bands.find((b,i)=>depth>=b.depth_mm[0]&&(depth<b.depth_mm[1]||(i===bands.length-1&&depth<=b.depth_mm[1])));
        tooltip.replaceChildren();const heading=document.createElement('div');
        heading.textContent=band?`d ${fmt(depth)} mm · ${fmt(band.depth_mm[0])}–${fmt(band.depth_mm[1])}`:`d ${fmt(depth)} mm`;tooltip.append(heading);
        const hover=[];
        for(const [key,name,color] of series) {
          if(!visible.has(key))continue;
          const radius=band?.radius_mm[key]??null,detail=document.createElement('div');detail.textContent=`${name} ${radius===null?'表面なし':fmt(radius)+' mm'}`;tooltip.append(detail);
          if(radius!==null)element(marks,'circle',{cx:px,cy:y(radius),r:3,fill:`var(--viz-series-${color})`,'data-chart-hover-marker':key});
          hover.push({key,radius_mm:radius});
        }
        tooltip.hidden=false;
        const rootBox=root.getBoundingClientRect(),tipBox=tooltip.getBoundingClientRect();
        tooltip.style.left=`${Math.max(4,Math.min(box.left-rootBox.left+px+12,rootBox.width-tipBox.width-4))}px`;
        tooltip.style.top=`${box.top-rootBox.top+top+8}px`;
        svg.dataset.hover=JSON.stringify({depth_mm:depth,guide_x:px,band:band?.depth_mm??null,series:hover});
      };
      overlay.addEventListener('pointermove',event=>{if(!pinned)show(event);});
      overlay.addEventListener('pointerleave',()=>{if(!pinned){tooltip.hidden=true;guide.setAttribute('visibility','hidden');marks.replaceChildren();}});
      overlay.addEventListener('click',event=>{pinned=!pinned;show(event);});
      svg.dataset.profile=JSON.stringify({width,height,x_domain:x.domain(),y_domain:y.domain(),x_range:x.range(),y_range:y.range(),bins:bands.length,data:bands,visible:[...visible]});
    }
    function checkLabels() {
      const labels=[...root.querySelectorAll('[data-label]')],overlaps=[];
      for(let i=0;i<labels.length;i++)for(let j=i+1;j<labels.length;j++) {
        const a=labels[i].getBoundingClientRect(),b=labels[j].getBoundingClientRect();
        if(a.left<b.right+4&&a.right+4>b.left&&a.top<b.bottom+4&&a.bottom+4>b.top)overlaps.push([labels[i].textContent,labels[j].textContent]);
      }
      root.dataset.labelOverlaps=JSON.stringify(overlaps);
    }
    function draw() {
      const selected=rows.find(row=>row.id===select.value),header=data.headers.find(h=>h.axes.includes(selected));
      const offset=Number(slider.value),bands=registered(selected,offset),minimum=minimumDifferences(bands);
      pinned=false;tooltip.hidden=true;root.querySelector('[data-offset-label]').textContent=`${fmt(offset)} mm`;
      drawMap(header,selected);drawProfile(bands,offset);
      const details=['SES2001','SEV2001'].filter(name=>visible.has('H05')&&visible.has(name)).map(name=>
        `${name} ${minimum[name].minimum===null?'比較区間なし':signed(minimum[name].minimum.difference_mm)+' mm'}`);
      root.querySelector('[data-detail]').textContent=details.length?`半径差の最小値：${details.join(' ／ ')}`:'表示中の半径差なし';
      root.dataset.observation=JSON.stringify({id:selected.id,frame:selected.frame,axes_total:rows.length,offset_mm:offset,
        adopted_offset_mm:data.adopted_offset_mm,minimum_differences:minimum,tool_triangles:Object.fromEntries(Object.entries(data.tools).map(([name,tool])=>[name,tool.source_triangles]))});
      requestAnimationFrame(checkLabels);root.dataset.ready='true';
    }
    select.addEventListener('change',draw);slider.addEventListener('input',draw);new ResizeObserver(draw).observe(root);draw();
  })();
  </script>
</div>
